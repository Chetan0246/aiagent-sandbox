[Slice]
# Hard limit on physical RAM allocation for the agent user slice
MemoryMax=448M

# Hard limit on swap allocation to prevent hiding memory exhaustion
MemorySwapMax=128M

# Hard limit on task/thread creation to mitigate fork bombs and thread starvation
TasksMax=256

# CPU quota to prevent runaway agent processes from starving hypervisor cores
CPUQuota=90%
