[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sandbox"
version = "1.0.0"
description = "Security evaluation and boundary enforcement CLI for autonomous AI agent sandboxes"
readme = "README.md"
authors = [{ name = "Chetan", email = "moorthy.chetan2024@vitstudent.ac.in" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai-agents", "security", "sandbox", "cgroups", "kvm", "isolation", "llm-security"]
requires-python = ">=3.9"

[project.scripts]
aegis-sandbox = "aegissandbox.cli:main"
aegis = "aegissandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
