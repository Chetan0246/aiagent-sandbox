[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sandbox"
version = "1.0.0"
description = "Boundary enforcement and multi-backend isolation suite for autonomous AI agents"
readme = "README.md"
authors = [{ name = "Chetan", email = "moorthy.chetan2024@vitstudent.ac.in" }]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai-agents", "security", "sandbox", "cgroups", "kvm", "isolation", "llm-security", "seccomp"]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Chetan0246/aiagent-sandbox"
Repository = "https://github.com/Chetan0246/aiagent-sandbox.git"
Documentation = "https://github.com/Chetan0246/aiagent-sandbox#readme"
Issues = "https://github.com/Chetan0246/aiagent-sandbox/issues"

[project.scripts]
aegis = "aegissandbox.cli:main"
aegis-sandbox = "aegissandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegissandbox = ["py.typed", "data/*.json"]

# Ruff Configuration
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in argument defaults
]

# Mypy Configuration
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["aegissandbox"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = false

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

# Coverage Configuration
[tool.coverage.run]
source = ["src/aegissandbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
