name: Aegis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Mypy Type Checker
        run: mypy src/aegissandbox

  test-and-enforcement:
    name: Test & Policy Enforcement (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install Package and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite with Strict Coverage (>=80%)
        run: |
          pytest --cov=aegissandbox --cov-report=xml --cov-report=term-missing

      - name: Throwaway Namespace Policy Enforcement Test
        run: |
          aegis run --backend namespaces -- echo "Namespace Policy Execution OK"
          ! aegis run --backend namespaces -- touch /etc/ci_test_forbidden

      - name: Throwaway Container Policy Enforcement Test
        run: |
          aegis run --backend container -- echo "Container Policy Execution OK"
          ! aegis run --backend container -- touch /etc/ci_test_forbidden

      - name: Declarative Policy Enforcement Test
        run: |
          aegis run --policy configs/policies/default.yaml --backend namespaces -- echo "Declarative Policy OK"

      - name: Security Scanning and Probes Test
        run: |
          aegis probe --gateway 127.0.0.1
          aegis scan --sudoers configs/sudoers/agentuser.sudoers
          aegis report --json
          aegis harness --runs 1

      - name: Validate Sudoers Configuration Syntax
        run: |
          sudo visudo -c -f configs/sudoers/agentuser.sudoers
