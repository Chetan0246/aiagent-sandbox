name: Aegis-Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap

    - name: Install Python Package
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run Full Test Suite
      run: |
        python -m unittest discover -s tests

    - name: Test CLI Subcommands
      run: |
        aegis-sandbox --help
        aegis-sandbox probe --gateway 127.0.0.1
        aegis-sandbox scan --sudoers configs/sudoers/agentuser.sudoers
        aegis-sandbox run --backend namespaces -- echo "Aegis Sandbox CI Enforcement Verified"
        aegis-sandbox report --json

    - name: Validate Sudoers Configuration Syntax
      run: |
        sudo visudo -c -f configs/sudoers/agentuser.sudoers
